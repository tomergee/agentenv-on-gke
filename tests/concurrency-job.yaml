# In-cluster load generator for tests/concurrency.py. Render with N and RUN_LABEL substituted:
#   sed "s/__N__/100/; s/__LABEL__/burst-100/" tests/concurrency-job.yaml | kubectl -n agentenv-system apply -f -
# The script and the instance list come from ConfigMap agentenv-concurrency (see docs/concurrency-report.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: agentenv-concurrency-__N__
  namespace: agentenv-system
  labels: {app.kubernetes.io/name: agentenv-concurrency}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: agentenv-concurrency}
    spec:
      restartPolicy: Never
      nodeSelector: {cloud.google.com/gke-nodepool: default-pool}
      containers:
        - name: load
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - pip install -q --root-user-action=ignore "e2b==2.51.0" requests packaging 1>&2 && exec python /work/concurrency.py
          env:
            - {name: GW, value: "http://agentenv-gateway:8080"}
            - {name: "N", value: "__N__"}
            - {name: RUN_LABEL, value: "__LABEL__"}
            - {name: INSTANCES, value: "/work/instances.txt"}
            - {name: CPU, value: "2"}
            - {name: MEM, value: "2048"}
            - name: KEY
              valueFrom: {secretKeyRef: {name: agentenv-auth, key: AENV_API_KEY}}
          resources:
            requests: {cpu: "1", memory: 1Gi}
          volumeMounts: [{name: work, mountPath: /work}]
      volumes:
        - name: work
          configMap: {name: agentenv-concurrency}
