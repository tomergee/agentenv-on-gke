# In-cluster load generator for tests/concurrency.py. Render and run with tests/run-concurrency.sh,
# which substitutes the __PLACEHOLDERS__ and refreshes ConfigMap agentenv-concurrency (script +
# instance list). See docs/concurrency-p50-p90-report.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: agentenv-concurrency-__MODE__-__N__
  namespace: agentenv-system
  labels: {app.kubernetes.io/name: agentenv-concurrency}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: agentenv-concurrency}
    spec:
      restartPolicy: Never
      nodeSelector: {cloud.google.com/gke-nodepool: default-pool}
      containers:
        - name: load
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - pip install -q --root-user-action=ignore "e2b==2.51.0" requests packaging 1>&2 && exec python /work/concurrency.py
          env:
            - {name: GW, value: "http://agentenv-gateway:8080"}
            - {name: "N", value: "__N__"}
            - {name: RUN_LABEL, value: "__LABEL__"}
            - {name: MODE, value: "__MODE__"}
            - {name: TEMPLATE, value: "swe-tpl-django-11099"}
            - {name: SOURCES, value: "12"}
            - {name: INSTANCES, value: "/work/instances.txt"}
            - {name: CPU, value: "__CPU__"}
            - {name: MEM, value: "__MEM__"}
            - {name: FILL_TOTAL, value: "__FILL_TOTAL__"}
            - {name: FILL_BATCH, value: "__FILL_BATCH__"}
            - name: KEY
              valueFrom: {secretKeyRef: {name: agentenv-auth, key: AENV_API_KEY}}
          resources:
            requests: {cpu: "1", memory: 1Gi}
          volumeMounts: [{name: work, mountPath: /work}]
      volumes:
        - name: work
          configMap: {name: agentenv-concurrency}
