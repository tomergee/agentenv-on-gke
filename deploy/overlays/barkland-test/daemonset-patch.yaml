apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agentenv-node
spec:
  template:
    spec:
      # Only the nested-virtualization node pool has /dev/kvm.
      nodeSelector:
        kubernetes.io/os: linux
        kvm: "true"
      # hostPID lets the init container nsenter the host to load ublk_drv and set
      # sysctls; upstream expects scripts/docker-setup.sh to have run on each host.
      hostPID: true
      initContainers:
        - name: host-prep
          image: busybox:1.36
          securityContext:
            privileged: true
          command: ["sh", "-c"]
          args:
            - |
              set -u
              exec nsenter -t 1 -m -u -i -n -p -- sh -c '
                set -u
                echo "host-prep: kernel $(uname -r)"
                [ -e /dev/kvm ] || { echo "host-prep: /dev/kvm missing on this node" >&2; exit 1; }
                if [ -d /sys/module/ublk_drv ]; then
                  cur=$(cat /sys/module/ublk_drv/parameters/ublks_max 2>/dev/null || echo unknown)
                  inuse=$(ls /sys/class/ublk-char 2>/dev/null | wc -l)
                  if [ "$cur" != "4096" ] && [ "$inuse" = "0" ]; then
                    if modprobe -r ublk_drv && modprobe ublk_drv ublks_max=4096; then
                      echo "host-prep: reloaded ublk_drv with ublks_max=4096 (was $cur)"
                    else
                      echo "host-prep: WARNING could not reload ublk_drv; continuing with ublks_max=$cur" >&2
                      modprobe ublk_drv || true
                    fi
                  else
                    echo "host-prep: ublk_drv already loaded (ublks_max=$cur, devices in use=$inuse); left as is"
                  fi
                else
                  modprobe ublk_drv ublks_max=4096 || { echo "host-prep: cannot load ublk_drv" >&2; exit 1; }
                  echo "host-prep: loaded ublk_drv with ublks_max=4096"
                fi
                modprobe nf_conntrack 2>/dev/null || true
                for kv in net.ipv4.neigh.default.gc_thresh1=4096 net.ipv4.neigh.default.gc_thresh2=8192 \
                          net.ipv4.neigh.default.gc_thresh3=16384 net.netfilter.nf_conntrack_max=1048576 \
                          kernel.pid_max=4194304 fs.inotify.max_user_instances=8192; do
                  sysctl -w "$kv" >/dev/null 2>&1 && echo "host-prep: sysctl $kv" || echo "host-prep: WARNING sysctl $kv failed (skipped)"
                done
                echo "host-prep: done"
              '
      containers:
        - name: agentenv
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
          volumeMounts:
            # regctl (AgentENV's image puller) reads $HOME/.docker/config.json on every
            # call, so a refreshed short-lived token works for private Artifact Registry
            # pulls even though AgentENV itself loads credentials only at startup.
            - name: registry-creds
              mountPath: /root/.docker
        # Workload Identity token refresher. The pool runs GKE_METADATA, so the pod's
        # Kubernetes ServiceAccount (agentenv-system/default) is the identity; it holds
        # roles/artifactregistry.reader on the repositories listed in plans/decisions.md.
        # Tokens live about an hour; refresh every 15 minutes and write atomically.
        - name: registry-creds
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -u
              while true; do
                tok=$(wget -qO- --header 'Metadata-Flavor: Google' \
                  'http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token' \
                  | sed -n 's/.*"access_token" *: *"\([^"]*\)".*/\1/p')
                if [ -n "$tok" ]; then
                  auth=$(printf 'oauth2accesstoken:%s' "$tok" | base64 | tr -d '\n')
                  printf '{"auths":{"us-docker.pkg.dev":{"auth":"%s"},"us-central1-docker.pkg.dev":{"auth":"%s"}}}\n' "$auth" "$auth" > /creds/config.json.tmp \
                    && mv /creds/config.json.tmp /creds/config.json \
                    && echo "registry-creds: refreshed $(date -u +%FT%TZ)"
                else
                  echo "registry-creds: WARNING no token from the metadata server; retrying in 60s" >&2
                  sleep 60; continue
                fi
                sleep 900
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: registry-creds
              mountPath: /creds
      volumes:
        - name: registry-creds
          emptyDir:
            medium: Memory
