apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AgentENV v0.2.2 on barkland-test (gke-ai-eco-dev, us-central1-a). Accepted limitations
# (plans/execution-plan.md): one nested-virtualization c2-standard-8 runtime node (label
# kvm=true) so no cross-node routing and a posix_fs snapshot repository on that node's
# hostPath; gateway and scheduler at one replica on default-pool; no TLS or ingress
# (access via kubectl port-forward); one shared API key.
namespace: agentenv-system

resources:
  - ../../base

# Pinned by digest (recorded in plans/decisions.md). The tags these digests were resolved
# from: aenv-server v0.2.2-amd64, agentenv-gateway v0.2.2, agentenv-scheduler v0.2.2.
images:
  - name: agentenv-runtime
    newName: ghcr.io/kvcache-ai/aenv-server
    digest: sha256:7ce67e1f078c461ebe00a88328c190d7cdefd12988d35dbea209a87787e0117b
  - name: agentenv-gateway
    newName: us-central1-docker.pkg.dev/gke-ai-eco-dev/agentenv/agentenv-gateway
    digest: sha256:452e3e4a0667f9d40c50bbf7d7a5b828fcb8245eb817f914da837dfc28e039ed
  - name: agentenv-scheduler
    newName: us-central1-docker.pkg.dev/gke-ai-eco-dev/agentenv/agentenv-scheduler
    digest: sha256:7d336fbfdc29e18b598f057f53bc9790edb034266105d750b77de84bfeff2464

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # Replaces the base config with the node-sized one (smaller caches, home_path).
  - name: agentenv-k8s-config
    behavior: replace
    files:
      - config/agentenv.toml

# Secrets are NOT generated here, so the overlay renders on a clean checkout
# (kubectl kustomize / kubectl diff -k). scripts/deploy.sh creates Secret/agentenv-auth
# and Secret/agentenv-runtime-secrets from the gitignored .secrets/ files before applying.
# The base's empty agentenv-auth Secret is removed so an apply never blanks the real key.
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: agentenv-auth
  # Keep the control plane off the runtime node so it neither competes with Firecracker
  # VMs for the 8 vCPUs nor skews latency measurements.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector/cloud.google.com~1gke-nodepool
        value: default-pool
  - path: daemonset-patch.yaml
    target:
      kind: DaemonSet
      name: agentenv-node
