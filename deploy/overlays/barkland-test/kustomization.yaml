apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AgentENV v0.2.2 on barkland-test (gke-ai-eco-dev, us-central1-a): one nested-virt
# c2-standard-8 runtime node (label kvm=true), gateway and scheduler at one replica,
# no TLS or ingress (access via kubectl port-forward). See plans/execution-plan.md.
namespace: agentenv-system

resources:
  - ../../base

images:
  - name: agentenv-runtime
    newName: ghcr.io/kvcache-ai/aenv-server
    newTag: v0.2.2-amd64
  - name: agentenv-gateway
    newName: us-central1-docker.pkg.dev/gke-ai-eco-dev/agentenv/agentenv-gateway
    newTag: v0.2.2
  - name: agentenv-scheduler
    newName: us-central1-docker.pkg.dev/gke-ai-eco-dev/agentenv/agentenv-scheduler
    newTag: v0.2.2

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # Replaces the base config with the node-sized one (smaller caches).
  - name: agentenv-k8s-config
    behavior: replace
    files:
      - config/agentenv.toml

secretGenerator:
  # Generated by scripts/deploy.sh into .secrets/ (gitignored). Never commit them.
  - name: agentenv-auth
    behavior: replace
    envs:
      - .secrets/agentenv-auth.env
  - name: agentenv-runtime-secrets
    files:
      - sandbox-access-token-hash-seed=.secrets/sandbox-access-token-hash-seed

patches:
  - path: daemonset-patch.yaml
    target:
      kind: DaemonSet
      name: agentenv-node
